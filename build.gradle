plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
    id "com.modrinth.minotaur" version "2.+"
    id "io.github.themrmilchmann.curseforge-publish" version "0.6.1"
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'portalmod'
}

loom {
    accessWidenerPath = file("src/main/resources/portalmod.accesswidener")

    // Keep Forge-era generated assets/data on the resource path.
    runs {
        configureEach {
            ideConfigGenerated true
        }
        client {
            // Applies every mixin at startup to catch broken injection points early.
            vmArg "-Dportalmod.auditMixins=true"
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
// TODO(port): the Forge data generators still need porting to Fabric's datagen API.
// Their output is already committed in src/generated/resources, so they are skipped for now.
sourceSets.main.java { exclude 'net/portalmod/core/datagen/**' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojang's official names, so method/field names match the 1.16.5 Forge source.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // javax.annotation.Nullable/Nonnull, used throughout the 1.16.5 code
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation 'junit:junit:4.13.2'
}

processResources {
    def props = [
            version: mod_version, mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_authors: mod_authors, mod_description: mod_description,
            minecraft_version: minecraft_version, loader_version: loader_version
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE.md") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "portalmod"
    versionNumber = "${mod_version}-fabric-1.20.1"
    versionType = "release"
    uploadFile = remapJar
    gameVersions = ["1.20.1"]
    loaders = ["fabric"]
    changelog = rootProject.file("CHANGELOG_LATEST.md").text
}

curseforge {
    apiToken = System.getenv("CURSEFORGE_TOKEN")

    publications {
        register("curseForge") {
            projectId = "517296"

            artifacts.register("main") {
                displayName = "${mod_version}-fabric-1.20.1"

                changelog {
                    format = ChangelogFormat.MARKDOWN
                    from(file("CHANGELOG_LATEST.md"))
                }

                from(tasks.named("remapJar"))
            }
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    options.compilerArgs += ['-Xmaxerrs', '20000']
}
